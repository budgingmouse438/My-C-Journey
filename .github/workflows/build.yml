name: Build C

on:
  push:
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button on GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4      # copies your repo onto the runner

      - name: Compile every .c file
        run: |
          for f in $(find . -name '*.c'); do
            echo "Compiling $f"
            gcc -Wall -Wextra -o "${f%.c}" "$f"
          done

      - name: Run Hello World
        run: ./Hello_World/Helloworld
